# Weekly reminder: lists audit/<id> branches delivered more than 30 days ago.
# It never deletes anything: deleting is irreversible, Diego does it (docs/runbook/auditoria.md, step 8).
name: Audit retention

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only target.yaml is read from each audit branch (it holds delivered_on), never the findings.
      - name: Collect the audit profiles
        run: |
          git fetch --no-tags --depth=1 origin '+refs/heads/audit/*:refs/remotes/origin/audit/*' || true
          mkdir -p "$RUNNER_TEMP/audits"
          for ref in $(git for-each-ref --format='%(refname:lstrip=4)' 'refs/remotes/origin/audit/'); do
            if ! printf '%s' "$ref" | grep -Eq '^[a-z0-9][a-z0-9-]{0,40}$'; then
              echo "::warning::Skipping branch audit/$ref: not a valid audit id"
              continue
            fi
            mkdir -p "$RUNNER_TEMP/audits/$ref"
            if ! git show "origin/audit/$ref:audits/$ref/target.yaml" > "$RUNNER_TEMP/audits/$ref/target.yaml"; then
              echo "::warning::Branch audit/$ref has no audits/$ref/target.yaml"
              rm -rf "${RUNNER_TEMP:?}/audits/$ref"
            fi
          done

      - name: List expired audits
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON packages/explorer/src/cli.ts retention "$RUNNER_TEMP/audits" | tee -a "$GITHUB_STEP_SUMMARY"
