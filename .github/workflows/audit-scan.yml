# Audit scan: read-only crawl of a prospect's app (packages/explorer).
# Runs on the audit's own branch audit/<id> and commits findings/ and evidence/ there.
# Setup and the whole audit process: docs/runbook/auditoria.md
name: Audit scan

on:
  workflow_dispatch:
    inputs:
      audit_id:
        description: 'Audit id: folder audits/<id> on branch audit/<id> (lower case, digits and -)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: audit-${{ inputs.audit_id }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUDIT_ID: ${{ inputs.audit_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The tool code and this workflow must come from main: the audit branch is written by the
      # exploration (model) session and must never run with the repository secrets.
      - name: Only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (Use workflow from: main). The audit branch only holds data."
            exit 1
          fi

      - name: Check the audit id
        run: |
          if ! printf '%s' "$AUDIT_ID" | grep -Eq '^[a-z0-9][a-z0-9-]{0,40}$'; then
            echo "::error::Invalid audit_id: use lower case letters, digits and -"
            exit 1
          fi

      # Prospect data (screenshots, findings) must never land in a public repository.
      - name: Only on a private repository
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != "true" ]; then
            echo "::error::Audits only run on a private repository"
            exit 1
          fi

      - name: Check that the audit branch exists
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/branches/audit/$AUDIT_ID" > /dev/null 2>&1; then
            echo "::error::Branch audit/$AUDIT_ID not found. Create it with audits/$AUDIT_ID/target.yaml (see docs/runbook/auditoria.md)"
            exit 1
          fi

      # Tool code from main, without push credentials.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Only the audit's data folder from its branch, in audit-branch/ (the results are pushed from there).
      - uses: actions/checkout@v7
        with:
          ref: audit/${{ inputs.audit_id }}
          path: audit-branch
          sparse-checkout: audits/${{ inputs.audit_id }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # Loads exactly AUDIT_<ID>_EMAIL, _PASSWORD and _TOTP_SECRET: never another prospect's secrets
      # (a prefix would let audit "acme" load the secrets of "acme-uy").
      - name: Load the audit secrets
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          NAMES="$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON packages/explorer/src/cli.ts secret-names "$AUDIT_ID")"
          node packages/e2e-template/template/e2e/lib/ci-env.mjs --names "$NAMES"

      - name: Scan
        id: scan
        continue-on-error: true
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON packages/explorer/src/cli.ts scan "audit-branch/audits/$AUDIT_ID"

      # Committed even when blocked: the blocked reason is in measured.json.
      - name: Commit the results to the audit branch
        if: always()
        working-directory: audit-branch
        run: |
          git config user.name "qa-explorer"
          git config user.email "qa-explorer@users.noreply.github.com"
          git add "audits/$AUDIT_ID/findings" "audits/$AUDIT_ID/evidence" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "audit($AUDIT_ID): scan results"
            git push origin "HEAD:audit/$AUDIT_ID"
          fi

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-scan-${{ inputs.audit_id }}
          path: |
            audit-branch/audits/${{ inputs.audit_id }}/findings
            audit-branch/audits/${{ inputs.audit_id }}/evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if the scan was blocked
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::The scan was blocked or failed. The reason is in audits/$AUDIT_ID/findings/measured.json (blockedReason) on branch audit/$AUDIT_ID."
          exit 1
