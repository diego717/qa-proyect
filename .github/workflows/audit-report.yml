# Audit report: renders report/informe.html from the reviewed findings of audit/<id>.
# Needs review.yaml (every model finding decided) and summary.md committed on the branch.
name: Audit report

on:
  workflow_dispatch:
    inputs:
      audit_id:
        description: 'Audit id: folder audits/<id> on branch audit/<id>'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: audit-${{ inputs.audit_id }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUDIT_ID: ${{ inputs.audit_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The tool code and this workflow must come from main: the audit branch is written by the
      # exploration (model) session and must never run with the repository secrets.
      - name: Only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (Use workflow from: main). The audit branch only holds data."
            exit 1
          fi

      - name: Check the audit id
        run: |
          if ! printf '%s' "$AUDIT_ID" | grep -Eq '^[a-z0-9][a-z0-9-]{0,40}$'; then
            echo "::error::Invalid audit_id: use lower case letters, digits and -"
            exit 1
          fi

      - name: Only on a private repository
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != "true" ]; then
            echo "::error::Audits only run on a private repository"
            exit 1
          fi

      - name: Check that the audit branch exists
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/branches/audit/$AUDIT_ID" > /dev/null 2>&1; then
            echo "::error::Branch audit/$AUDIT_ID not found"
            exit 1
          fi

      # Tool code from main, without push credentials.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Only the audit's data folder from its branch, in audit-branch/ (the results are pushed from there).
      - uses: actions/checkout@v7
        with:
          ref: audit/${{ inputs.audit_id }}
          path: audit-branch
          sparse-checkout: audits/${{ inputs.audit_id }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails if a model finding is still pending review or summary.md is missing.
      - name: Render the report
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON packages/explorer/src/cli.ts report "audit-branch/audits/$AUDIT_ID"

      - name: Commit the report to the audit branch
        working-directory: audit-branch
        run: |
          git config user.name "qa-explorer"
          git config user.email "qa-explorer@users.noreply.github.com"
          git add "audits/$AUDIT_ID/report"
          if git diff --cached --quiet; then
            echo "Report unchanged"
          else
            git commit -m "audit($AUDIT_ID): report"
            git push origin "HEAD:audit/$AUDIT_ID"
          fi

      - name: Upload the report
        uses: actions/upload-artifact@v7
        with:
          name: audit-report-${{ inputs.audit_id }}
          path: audit-branch/audits/${{ inputs.audit_id }}/report/informe.html
          retention-days: 7
